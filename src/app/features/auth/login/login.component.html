<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title">
      {{ isLoginMode ? 'Connexion' : 'Créer un compte' }}
    </h1>

    <div *ngIf="errorMessage" class="auth-error">
      {{ errorMessage }}
    </div>

    <!-- Formulaire de CONNEXION -->
    <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()" class="auth-form">

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email">
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
          L'email est obligatoire.
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          Format d'email invalide.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password">
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Le mot de passe est obligatoire.
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <!-- Formulaire d'INSCRIPTION -->
    <form *ngIf="!isLoginMode" [formGroup]="registerForm" (ngSubmit)="onSubmitRegister()" class="auth-form">

      <mat-form-field appearance="outline">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="firstName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="lastName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email">
        <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
          Format d'email invalide.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password">
        <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
          6 caractères minimum.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Téléphone (optionnel)</mat-label>
        <input matInput formControlName="phoneNumber">
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <button mat-button type="button" (click)="toggleMode()" class="auth-toggle">
      {{ isLoginMode ? "Pas encore de compte ? S'inscrire" : 'Déjà un compte ? Se connecter' }}
    </button>

  </div>
</div>
